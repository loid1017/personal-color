<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カラー&性格診断</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #faf9f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    position: relative;
  }

  /* ===== START ===== */
  #start-screen { text-align: center; animation: fadeIn 0.8s ease; }

  .logo { font-size: 52px; margin-bottom: 16px; }

  .title {
    font-size: 26px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 14px;
    color: #888;
    margin-bottom: 12px;
    line-height: 1.7;
  }

  .badge-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 36px;
  }

  .badge {
    background: #f0f0f0;
    border-radius: 50px;
    padding: 5px 14px;
    font-size: 12px;
    color: #666;
  }

  .start-btn {
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #a18cd1);
    border: none;
    border-radius: 50px;
    padding: 16px 52px;
    font-size: 16px;
    font-weight: 700;
    color: white;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    box-shadow: 0 8px 32px rgba(161,140,209,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(161,140,209,0.45); }
  .made-by {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: linear-gradient(90deg, #a18cd1, #fbc2eb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }

  .note { margin-top: 18px; font-size: 12px; color: #bbb; }

  /* ===== QUIZ ===== */
  #quiz-screen { width: 100%; display: none; flex-direction: column; align-items: center; }

  .progress-bar-wrap {
    width: 100%; height: 4px; background: #e8e8e8;
    border-radius: 2px; margin-bottom: 28px;
  }

  .progress-bar {
    height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #a18cd1, #fbc2eb);
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  .q-counter { font-size: 12px; color: #bbb; margin-bottom: 8px; align-self: flex-end; }

  .q-phase {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 50px;
    margin-bottom: 14px;
    color: white;
  }

  .q-text {
    font-size: 20px;
    font-weight: 700;
    color: #1a1a1a;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 32px;
  }

  .color-card-wrap { width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .color-option {
    border: none;
    border-radius: 20px;
    height: 80px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
  }

  .color-option:active { transform: scale(0.96); }

  .color-option .opt-label {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 4px rgba(0,0,0,0.25);
    pointer-events: none;
  }

  .color-option.selected {
    box-shadow: 0 0 0 4px #1a1a1a, 0 8px 24px rgba(0,0,0,0.15);
    transform: scale(1.02);
  }

  /* personality questions */
  .text-option-wrap { width: 100%; display: flex; flex-direction: column; gap: 12px; }

  .text-option {
    border: 2px solid #eee;
    border-radius: 16px;
    padding: 18px 20px;
    background: white;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    font-size: 15px;
    color: #333;
    line-height: 1.5;
  }

  .text-option:hover { border-color: #c4a4d4; background: #fdf8ff; }
  .text-option.selected { border-color: #a18cd1; background: #f5eeff; transform: scale(1.01); }
  .text-option .opt-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

  .skip-btn {
    margin-top: 20px;
    background: none;
    border: 1px solid #ddd;
    border-radius: 50px;
    padding: 10px 28px;
    font-size: 13px;
    color: #aaa;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .skip-btn:hover { border-color: #bbb; color: #888; }

  /* ===== RESULT ===== */
  #result-screen { width: 100%; display: none; flex-direction: column; align-items: center; animation: slideUp 0.6s ease; }

  .result-badge {
    width: 130px; height: 130px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 54px; margin-bottom: 16px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  }

  .result-type {
    font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; color: #aaa; margin-bottom: 6px;
  }

  .result-name {
    font-size: 30px; font-weight: 800; color: #1a1a1a;
    margin-bottom: 4px; text-align: center;
  }

  .result-tagline {
    font-size: 14px; color: #999; margin-bottom: 28px; text-align: center;
  }

  /* tabs */
  .tab-bar {
    display: flex; width: 100%; border-bottom: 2px solid #eee;
    margin-bottom: 24px; gap: 0;
  }

  .tab-btn {
    flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600;
    color: #bbb; background: none; border: none; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: color 0.2s, border-color 0.2s;
  }

  .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }

  .tab-content { width: 100%; display: none; }
  .tab-content.active { display: block; }

  /* color tab */
  .season-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }

  .season-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

  .season-name { font-size: 18px; font-weight: 700; }
  .season-en { font-size: 12px; color: #aaa; }

  .section-desc {
    font-size: 14px; color: #555; line-height: 1.8;
    margin-bottom: 20px;
  }

  .palette-label { font-size: 12px; color: #aaa; margin-bottom: 10px; }

  .palette-row { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }

  .swatch {
    width: 44px; height: 44px; border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: transform 0.2s;
    cursor: default;
  }
  .swatch:hover { transform: scale(1.12); }

  /* personality tab */
  .persona-card {
    background: white; border-radius: 20px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
  }

  .persona-card-title {
    font-size: 13px; font-weight: 700;
    color: #aaa; letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .persona-card-body { font-size: 14px; color: #444; line-height: 1.8; }

  .trait-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }

  .trait-tag {
    background: #f5eeff; border-radius: 50px;
    padding: 6px 14px; font-size: 13px; color: #7c5cbf;
    font-weight: 600;
  }

  .compat-row { display: flex; gap: 12px; flex-wrap: wrap; }

  .compat-card {
    flex: 1; min-width: 120px; background: #fafafa;
    border-radius: 14px; padding: 14px;
    text-align: center;
  }

  .compat-emoji { font-size: 28px; margin-bottom: 6px; }
  .compat-name { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 4px; }
  .compat-desc { font-size: 11px; color: #aaa; line-height: 1.4; }

  /* score tab */
  .score-row {
    display: flex; align-items: center;
    gap: 10px; margin-bottom: 12px;
  }
  .score-label { font-size: 12px; width: 72px; color: #666; flex-shrink: 0; }
  .score-bar-bg {
    flex: 1; height: 8px; background: #eee;
    border-radius: 4px; overflow: hidden;
  }
  .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }
  .score-val { font-size: 11px; color: #bbb; width: 28px; text-align: right; flex-shrink: 0; }

  .axis-section { margin-top: 24px; }
  .axis-title { font-size: 12px; color: #aaa; margin-bottom: 14px; }
  .axis-bar-wrap { margin-bottom: 16px; }
  .axis-labels { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .axis-lbl { font-size: 12px; color: #888; }
  .axis-track { height: 10px; background: #eee; border-radius: 5px; position: relative; }
  .axis-fill {
    position: absolute; top: 0; height: 100%;
    border-radius: 5px; transition: all 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .axis-thumb {
    position: absolute; top: 50%; width: 18px; height: 18px;
    background: white; border: 3px solid #a18cd1; border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: left 0.8s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .retry-btn {
    background: #1a1a1a; color: white; border: none;
    border-radius: 50px; padding: 14px 40px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    margin-top: 8px; margin-bottom: 32px;
  }
  .retry-btn:hover { background: #333; transform: translateY(-1px); }

  .flash { position: fixed; inset: 0; pointer-events: none; z-index: 99; opacity: 0; transition: opacity 0.2s; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="app">

  <div id="start-screen">
    <div class="logo">🎨</div>
    <div class="made-by">Version 0.1 &nbsp;·&nbsp; made by ロイド</div>
    <div class="title">カラー＆性格診断</div>
    <div class="subtitle">色の直感選びで<br>パーソナルカラーと性格タイプがわかる</div>
    <div class="badge-row">
      <span class="badge">16問</span>
      <span class="badge">約2分</span>
      <span class="badge">8タイプ</span>
    </div>
    <button class="start-btn" onclick="startQuiz()">診断スタート</button>
    <div class="note">文章を読む必要なし。色を見て直感で選ぶだけ。</div>
  </div>

  <div id="quiz-screen">
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>
    <div class="q-counter" id="q-counter"></div>
    <div class="q-phase" id="q-phase"></div>
    <div class="q-text" id="q-text"></div>
    <div id="options-wrap"></div>
    <button class="skip-btn" onclick="skipQuestion()">どちらでもない</button>
  </div>

  <div id="result-screen">
    <div class="result-badge" id="result-badge"></div>
    <div class="result-type" id="result-type"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-tagline" id="result-tagline"></div>

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('color')">カラー</button>
      <button class="tab-btn" onclick="switchTab('persona')">性格</button>
      <button class="tab-btn" onclick="switchTab('score')">スコア</button>
    </div>

    <div class="tab-content active" id="tab-color"></div>
    <div class="tab-content" id="tab-persona"></div>
    <div class="tab-content" id="tab-score"></div>

    <button class="retry-btn" onclick="resetQuiz()">もう一度診断する</button>
  </div>

</div>
<div class="flash" id="flash"></div>

let current = 0;
let colorScores = { spring:0, summer:0, autumn:0, winter:0 };
let personaScores = { E:0, I:0, S:0, N:0 };

function startQuiz() {
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'flex';
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;

  document.getElementById('progress-bar').style.width = `${(current/total)*100}%`;
  document.getElementById('q-counter').textContent = `${current+1} / ${total}`;

  const phase = document.getElementById('q-phase');
  phase.textContent = q.phase;
  phase.style.background = q.phaseColor;

  document.getElementById('q-text').textContent = q.text;

  const wrap = document.getElementById('options-wrap');
  wrap.innerHTML = '';

  if (q.type === 'color') {
    const div = document.createElement('div');
    div.className = 'color-card-wrap';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'color-option';
      btn.style.background = opt.gradient;
      btn.innerHTML = `<span class="opt-label">${opt.label}</span>`;
      btn.onclick = () => {
        flashEffect(btn.style.background);
        for (const k in opt.scores) colorScores[k] += opt.scores[k];
        btn.classList.add('selected');
        setTimeout(nextQuestion, 300);
      };
      div.appendChild(btn);
    });
    wrap.appendChild(div);
  } else {
    const div = document.createElement('div');
    div.className = 'text-option-wrap';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'text-option';
      btn.innerHTML = `${opt.label}<div class="opt-sub">${opt.sub}</div>`;
      btn.onclick = () => {
        for (const k in opt.scores) personaScores[k] += opt.scores[k];
        btn.classList.add('selected');
        setTimeout(nextQuestion, 300);
      };
      div.appendChild(btn);
    });
    wrap.appendChild(div);
  }
}

function flashEffect(bg) {
  const f = document.getElementById('flash');
  f.style.background = bg;
  f.style.opacity = '0.15';
  setTimeout(() => { f.style.opacity = '0'; }, 180);
}

function skipQuestion() { nextQuestion(); }

function nextQuestion() {
  current++;
  if (current >= questions.length) showResult();
  else renderQuestion();
}

function showResult() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'flex';

  // determine season
  const season = Object.entries(colorScores).sort((a,b)=>b[1]-a[1])[0][0];

  // determine axis
  const eAxis = personaScores.E >= personaScores.I ? 'E' : 'I';
  const sAxis = personaScores.S >= personaScores.N ? 'S' : 'N';
  const typeKey = `${season}_${eAxis}${sAxis}`;

  const ptype = personalityTypes[typeKey] || personalityTypes[`${season}_ES`];
  const sdata = seasons[season];

  // badge
  const badge = document.getElementById('result-badge');
  badge.style.background = ptype.badge;
  badge.textContent = ptype.emoji;

  document.getElementById('result-type').textContent = `${sdata.name} × ${eAxis === 'E' ? '外向' : '内向'} × ${sAxis === 'S' ? '感覚' : '直感'}`;
  document.getElementById('result-name').textContent = ptype.name;
  document.getElementById('result-tagline').textContent = ptype.tagline;

  buildColorTab(sdata, ptype);
  buildPersonaTab(ptype);
  buildScoreTab(sdata, eAxis, sAxis);
}

function buildColorTab(sdata, ptype) {
  const tab = document.getElementById('tab-color');
  tab.innerHTML = `
    <div class="season-header">
      <div class="season-dot" style="background:${sdata.color}"></div>
      <div>
        <div class="season-name">${sdata.name}</div>
        <div class="season-en">${sdata.en}</div>
      </div>
    </div>
    <div class="section-desc">${sdata.colorDesc}</div>
    <div class="palette-label">ベストカラー</div>
    <div class="palette-row" id="palette-swatches"></div>
  `;
  const row = tab.querySelector('#palette-swatches');
  sdata.palette.forEach(c => {
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    row.appendChild(sw);
  });
}

          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function buildScoreTab(sdata, eAxis, sAxis) {
  const tab = document.getElementById('tab-score');
  const totalColor = Object.values(colorScores).reduce((a,b)=>a+b,1);

  let html = '<div style="font-size:13px;color:#999;margin-bottom:14px;">カラー傾向</div>';
  ['spring','summer','autumn','winter'].forEach(s => {
    const pct = Math.round((colorScores[s]/totalColor)*100);
    html += `
      <div class="score-row">
        <div class="score-label">${seasons[s].name}</div>
        <div class="score-bar-bg">
          <div class="score-bar-fill" style="width:0%;background:${seasons[s].barColor}" data-target="${pct}"></div>
        </div>
        <div class="score-val">${pct}%</div>
      </div>`;
  });

  // E/I axis
  const totalEI = personaScores.E + personaScores.I || 1;
  const ePct = Math.round((personaScores.E / totalEI) * 100);

  // S/N axis
  const totalSN = personaScores.S + personaScores.N || 1;
  const sPct = Math.round((personaScores.S / totalSN) * 100);

  html += `
    <div class="axis-section">
      <div class="axis-title">性格軸</div>
      <div class="axis-bar-wrap">
        <div class="axis-labels">
          <span class="axis-lbl">外向 (E)</span>
          <span class="axis-lbl">内向 (I)</span>
        </div>
        <div class="axis-track">
          <div class="axis-fill" style="left:0;width:0%;background:linear-gradient(90deg,#FF9966,#FFB347)" data-target="${ePct}%" data-prop="width"></div>
          <div class="axis-thumb" style="left:0%" data-target="${ePct}%" data-prop="left"></div>
        </div>
      </div>
      <div class="axis-bar-wrap">
        <div class="axis-labels">
          <span class="axis-lbl">感覚 (S)</span>
          <span class="axis-lbl">直感 (N)</span>
        </div>
        <div class="axis-track">
          <div class="axis-fill" style="left:0;width:0%;background:linear-gradient(90deg,#9BBBD4,#C4A4D4)" data-target="${sPct}%" data-prop="width"></div>
          <div class="axis-thumb" style="left:0%" data-target="${sPct}%" data-prop="left"></div>
        </div>
      </div>
    </div>
  `;

  tab.innerHTML = html;

  // animate
  setTimeout(() => {
    tab.querySelectorAll('.score-bar-fill').forEach(el => {
      el.style.width = el.dataset.target + '%';
    });
    tab.querySelectorAll('[data-prop="width"]').forEach(el => {
      el.style.width = el.dataset.target;
    });
    tab.querySelectorAll('[data-prop="left"]').forEach(el => {
      el.style.left = el.dataset.target;
    });
  }, 100);
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('onclick') === `switchTab('${name}')`);
  });
  document.querySelectorAll('.tab-content').forEach(c => {
    c.classList.toggle('active', c.id === `tab-${name}`);
  });

  // re-animate score bars when switching to score tab
  if (name === 'score') {
    setTimeout(() => {
      document.querySelectorAll('#tab-score .score-bar-fill').forEach(el => {
        el.style.width = el.dataset.target + '%';
      });
      document.querySelectorAll('#tab-score [data-prop="width"]').forEach(el => {
        el.style.width = el.dataset.target;
      });
      document.querySelectorAll('#tab-score [data-prop="left"]').forEach(el => {
        el.style.left = el.dataset.target;
      });
    }, 50);
  }
}

function resetQuiz() {
  current = 0;
  colorScores = { spring:0, summer:0, autumn:0, winter:0 };
  personaScores = { E:0, I:0, S:0, N:0 };
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
  // reset tabs
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  document.querySelectorAll('.tab-content').forEach((c,i) => c.classList.toggle('active', i===0));
}
</script>
